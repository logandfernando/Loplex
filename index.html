<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Loplex</title>
  <style>
    body { background: #111; color: #fff; font-family: sans-serif; text-align: center; margin: 0; padding: 20px; }
    .tv-screen { max-width: 800px; margin: 0 auto 20px; background: #000; border: 4px solid #333; border-radius: 8px; overflow: hidden; }
    iframe { width: 100%; height: 450px; border: none; display: block; }
    .channels button { background: #222; color: #fff; border: 1px solid #444; padding: 10px 20px; margin: 5px; cursor: pointer; border-radius: 4px; font-size: 16px; }
    .channels button:hover { background: #e50914; border-color: #e50914; }
  </style>
</head>
<body>

  <h1>Loplex</h1>

  <div class="tv-screen">
    <!-- Replace the src below with your first video's embed link -->
    <iframe id="player" src="https://drive.google.com/file/d/1bWvSF4TCeEVKWvHRSaVihBY49qffaIM_/view?usp=sharing" allowfullscreen></iframe>
  </div>

  <div class="channels">
    <!-- Swap these links with your own YouTube /embed/ or Google Drive /preview links -->
    <button onclick="changeChannel('https://drive.google.com/file/d/1bWvSF4TCeEVKWvHRSaVihBY49qffaIM_/view?usp=sharing')">Channel 1</button>
    <button onclick="changeChannel('https://drive.google.com/file/d/1bWvSF4TCeEVKWvHRSaVihBY49qffaIM_/view?usp=sharing')">Channel 2</button>
  </div>

  <script>
    function changeChannel(url) {
      document.getElementById('player').src = url;
    }
  </script>

</body>
</html>
